name: MonoSync
options:
  bundleIdPrefix: com.baekmac
  xcodeVersion: "26.5"
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.14.0

settings:
  base:
    DEVELOPMENT_LANGUAGE: ko
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.9
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  MonoSync:
    type: application
    platform: iOS
    sources:
      - path: MonoSync
      - path: Shared
      - path: Font
        buildPhase: resources
      - path: image
        buildPhase: resources
      - path: sound
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - target: MonoSyncWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baekmac.MonoSync
        PRODUCT_NAME: MonoSync
        INFOPLIST_FILE: MonoSync/Support/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_ENTITLEMENTS: MonoSync/Support/MonoSync.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      run:
        debugEnabled: false

  MonoSyncWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MonoSyncWidget
      - path: Shared
      - path: Font
        buildPhase: resources
      - path: image
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baekmac.MonoSync.MonoSyncWidget
        PRODUCT_NAME: MonoSyncWidget
        INFOPLIST_FILE: MonoSyncWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: MonoSyncWidget/Support/MonoSyncWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: YES

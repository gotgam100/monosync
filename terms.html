<body class="bg-[#111111] text-gray-200 min-h-screen p-6 md:p-12">

    <h1 class="text-3xl font-bold mb-6 text-white">이용약관</h1>
    <div class="prose prose-invert">
      <p>본 약관은 MonoSync 서비스의 이용과 관련하여 회사와 사용자 간의 권리, 의무 및 책임사항을 규정합니다.</p>
      <h2 class="text-xl font-semibold mt-6 mb-2">1. 서비스의 제공</h2>
      <p>MonoSync는 Apple Music 구독 계정을 연동하여 친구들과 실시간으로 같은 음악을 들을 수 있는 플랫폼을 제공합니다.</p>
      <h2 class="text-xl font-semibold mt-6 mb-2">2. 사용자의 의무</h2>
      <p>사용자는 서비스 이용 시 법령, 본 약관, 공서양속을 준수해야 하며, 기타 회사의 업무에 방해되는 행위를 하여서는 안 됩니다.</p>
    </div>
